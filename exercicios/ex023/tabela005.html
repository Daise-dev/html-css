<!DOCTYPE html>
<html lang="ptbr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
           width: 400px;
           border-collapse: collapse;
        }

        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 8px;
        }

        td, th{ 
            border: 1px solid black;
            padding: 10px;
        }

        .destaque{
            background-color: lightgray;
            font-weight: bold;
        }

        .cnome{
            background-color: lightcoral;
        }

        col.cgrupo{
            background-color: lightsalmon;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <!-- <col class="csexo"> -->
            <col class="cgrupo" span="2">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome </th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>   
            <td>João</td>
            <td>Masculino</td>
            <td>25</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>Feminino</td>
            <td>30</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>Carlos</td>
            <td>Masculino</td>
            <td>28</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Ana</td>
            <td>Feminino</td>
            <td>22</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>Beatriz</td>
            <td>Feminino</td>
            <td>27</td>
            <td>Médica</td>
        </tr>
        <tr>
            <td>Pedro</td>
            <td>Masculino</td>
            <td>35</td>
            <td>Advogado</td>
        </tr>
      
    </table>
</body>
</html>
