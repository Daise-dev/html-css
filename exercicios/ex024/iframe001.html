<html lang="ptbr">
<head>

    <title>Estudos de IFrame</title>
    <style>
        iframe {
            width: 300px;
            height: 150px;
           
        }
    </style>
</head>
<body>

    <p>
        Acessando o site do 
        <!-- Tamanho padrão 300x150 -->

        para aprender a programar.
    </p>

    <p>
        O repositorio do <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="400" width="400">

        </iframe> também é muito legal.
    </p>
</body>
</html>
